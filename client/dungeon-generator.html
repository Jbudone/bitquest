<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitQuest - Procedural Dungeon & WFC Seed Generator (/tools/dungeon)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #dungeon-app-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: #7c3aed; border-color: #7c3aed; }
    .btn-primary:hover { background: #6d28d9; }
    .btn.active { background: #7c3aed; border-color: #a855f7; }
  </style>
</head>
<body>
  <div id="dungeon-app-root">
    <div id="dungeon-studio-container" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="module">
    import { DungeonStudio } from '/src/tools/dungeonStudio.ts';
    window.addEventListener('DOMContentLoaded', () => {
      const studio = new DungeonStudio('dungeon-studio-container');
      window.DungeonStudio = studio;
      console.log('🏰 BitQuest Procedural Dungeon & WFC Seed Generator initialized on /dungeon-generator.html');
    });
  </script>
</body>
</html>
