<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitQuest - Atmosphere & Dynamic Lighting Studio (/tools/atmosphere)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070a12;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #atmosphere-app-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #334155; }
    .btn-primary { background: #d97706; border-color: #f59e0b; }
    .btn-primary:hover { background: #b45309; }
    .btn.active { background: #d97706; border-color: #f59e0b; }
  </style>
</head>
<body>
  <div id="atmosphere-app-root">
    <div id="atmosphere-studio-container" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="module">
    import { AtmosphereStudio } from '/src/tools/atmosphereStudio.ts';
    window.addEventListener('DOMContentLoaded', () => {
      const studio = new AtmosphereStudio('atmosphere-studio-container');
      window.AtmosphereStudio = studio;
      console.log('☀️ BitQuest Atmosphere & Dynamic Lighting Studio initialized on /atmosphere.html');
    });
  </script>
</body>
</html>
