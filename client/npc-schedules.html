<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitQuest - NPC Daily Schedule & Behavior Path Router (/tools/schedules)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #schedule-app-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: #d97706; border-color: #d97706; }
    .btn-primary:hover { background: #b45309; }
    .btn.active { background: #d97706; border-color: #f59e0b; }
  </style>
</head>
<body>
  <div id="schedule-app-root">
    <div id="npc-schedule-container" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="module">
    import { NPCScheduleStudio } from '/src/tools/npcScheduleStudio.ts';
    window.addEventListener('DOMContentLoaded', () => {
      const studio = new NPCScheduleStudio('npc-schedule-container');
      window.NPCScheduleStudio = studio;
      console.log('🧭 BitQuest NPC Daily Schedule & Behavior Path Router initialized on /npc-schedules.html');
    });
  </script>
</body>
</html>
