<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BitQuest 2K Map Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 2048px;
      height: 1792px;
      overflow: hidden;

</html>
