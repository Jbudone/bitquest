<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitQuest - Macro-Economy & Progression Monte Carlo Simulator (/tools/economy)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #economy-app-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #334155; }
    .btn-primary { background: #6366f1; border-color: #818cf8; }
    .btn-primary:hover { background: #4f46e5; }
    .btn.active { background: #6366f1; border-color: #818cf8; }
  </style>
</head>
<body>
  <div id="economy-app-root">
    <div id="economy-studio-container" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="module">
    import { EconomySimStudio } from '/src/tools/economySimStudio.ts';
    window.addEventListener('DOMContentLoaded', () => {
      const studio = new EconomySimStudio('economy-studio-container');
      window.EconomySimStudio = studio;
      console.log('📈 BitQuest Macro-Economy & Progression Monte Carlo Simulator initialized on /economy-sim.html');
    });
  </script>
</body>
</html>
