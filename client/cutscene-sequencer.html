<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitQuest - Cinematic Sequencer & Cutscene Choreographer (/tools/cutscene)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #cutscene-app-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: #0284c7; border-color: #0284c7; }
    .btn-primary:hover { background: #0369a1; }
    .btn.active { background: #0284c7; border-color: #38bdf8; }
  </style>
</head>
<body>
  <div id="cutscene-app-root">
    <div id="cutscene-studio-container" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="module">
    import { CutsceneStudio } from '/src/tools/cutsceneStudio.ts';
    window.addEventListener('DOMContentLoaded', () => {
      const studio = new CutsceneStudio('cutscene-studio-container');
      window.CutsceneStudio = studio;
      console.log('🎬 BitQuest Cinematic Sequencer & Cutscene Choreographer initialized on /cutscene-sequencer.html');
    });
  </script>
</body>
</html>
