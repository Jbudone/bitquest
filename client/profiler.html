<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitQuest - Zero-Allocation Heap Watchdog & Micro-Profiler (/tools/profiler)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #profiler-app-root {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: #334155; }
    .btn-primary { background: #059669; border-color: #10b981; }
    .btn-primary:hover { background: #047857; }
    .btn.active { background: #059669; border-color: #10b981; }
  </style>
</head>
<body>
  <div id="profiler-app-root">
    <div id="profiler-container" style="width: 100%; height: 100%;"></div>
  </div>

  <script type="module">
    import { ProfilerStudio } from '/src/tools/profilerStudio.ts';
    window.addEventListener('DOMContentLoaded', () => {
      const studio = new ProfilerStudio('profiler-container');
      window.ProfilerStudio = studio;
      console.log('⏱️ BitQuest Zero-Allocation Heap Watchdog & Micro-Profiler initialized on /profiler.html');
    });
  </script>
</body>
</html>
